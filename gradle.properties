# Build performance.
#
# Keep org.gradle.jvmargs identical to the value in GRADLE_USER_HOME so this
# project shares one daemon with the others on this machine. A differing value
# makes Gradle fork a second daemon, which is what drives peak RAM use.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Configure the ten subprojects in parallel when the configuration cache is in use.
org.gradle.configuration-cache.parallel=true

# Nine Stonecutter targets can otherwise start nine remap/compile jobs at once.
# On a mechanical disk that turns sequential reads into seek thrashing and is
# slower than a lower fan-out, besides bounding RAM. Raise if you move to an SSD.
org.gradle.workers.max=4

mod_id=kernel
mod_name=Kernel
mod_version=0.1.0
knot_client_version=0.1.0
fabric_maven_group=dev.kernel.fabric
knot_client_maven_group=dev.kernel.client

